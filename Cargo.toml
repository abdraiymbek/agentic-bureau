[workspace]
members = ["crates/contracts", "crates/storage", "crates/core", "crates/agent-host", "apps/rust-desktop", "apps/headless"]
exclude = ["native/bureau-bridge"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/abdraiymbek/agentic-bureau"
homepage = "https://github.com/abdraiymbek/agentic-bureau"
version = "0.2.5"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
