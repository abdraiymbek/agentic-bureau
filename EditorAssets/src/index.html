<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src directory-asset: data:; font-src 'self' data:; connect-src 'none';">
<link rel="stylesheet" href="katex.min.css">
<style>
:root { --canvas:#FCFCFC; --primary:#25282C; --secondary:#656C75; --accent:#476881; --border:#E2E4E6; --code:#F1F2F3; }
html { background: var(--canvas); }
body {
  margin: 0; padding: 24px 28px 48px;
  color: var(--primary); background: var(--canvas);
  font-family: -apple-system, "SF Pro Text", sans-serif;
  font-size: 15px; line-height: 1.65;
  max-width: 720px; margin-left: auto; margin-right: auto;
  overflow-wrap: break-word;
}
h1 { font-size: 26px; font-weight: 600; line-height: 1.3; margin: 0.8em 0 0.4em; }
h2 { font-size: 21px; font-weight: 600; margin: 1.2em 0 0.4em; }
h3 { font-size: 18px; font-weight: 600; margin: 1.2em 0 0.4em; }
h4, h5, h6 { font-size: 15px; font-weight: 600; margin: 1.2em 0 0.4em; }
p { margin: 0.6em 0; }
a { color: var(--accent); text-decoration: none; }
a.wiki { color: var(--accent); border-bottom: 1px dotted var(--accent); cursor: pointer; }
code {
  font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 13px;
  background: var(--code); padding: 1px 5px; border-radius: 4px;
}
pre { background: var(--code); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
pre code { background: none; padding: 0; }
blockquote { margin: 0.6em 0; padding: 0 0 0 12px; border-left: 2px solid var(--border); color: var(--secondary); }
hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }
ul, ol { padding-left: 22px; margin: 0.6em 0; }
li { margin: 0.15em 0; }
li input[type="checkbox"] { margin-right: 6px; accent-color: var(--accent); }
table { border-collapse: collapse; margin: 0.8em 0; width: 100%; }
th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
th { font-weight: 600; }
img { max-width: 100%; }
.katex { font-size: 1.05em; }
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
</style>
<script src="preview.js" defer></script>
</head>
<body>
<div id="preview"></div>
</body>
</html>
