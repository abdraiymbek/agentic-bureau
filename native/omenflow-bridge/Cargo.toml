[package]
name = "omenflow-bridge"
version = "1.0.1"
edition = "2021"
description = "omenflow CLI helper — connects agent sessions to the Omen Flow app bridge"
license = "Apache-2.0"
repository = "https://github.com/abdraiymbek/omen-flow"

[[bin]]
name = "omenflow"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"

[profile.release]
opt-level = 2
strip = true
