[package]
name = "bureau-bridge"
version = "0.2.5"
edition = "2021"
description = "bureau CLI helper — connects agent sessions to the Bureau app bridge"
license = "Apache-2.0"
repository = "https://github.com/abdraiymbek/agentic-bureau"

[[bin]]
name = "bureau"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"

[profile.release]
opt-level = 2
strip = true
