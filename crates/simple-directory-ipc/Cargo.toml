[package]
name = "simple-directory-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wire protocol + shared dispatch between the simple.directory app backend and the simple-directory CLI frontend."

[dependencies]
simple-directory-engine = { path = "../simple-directory-engine" }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }

[dev-dependencies]
simple-directory-core = { path = "../simple-directory-core" }
tempfile = "3"
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true }
