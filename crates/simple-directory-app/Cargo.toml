[package]
name = "simple-directory-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Tauri shell — a thin frontend over simple-directory-engine (the actual logic)."
default-run = "simple-directory-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The frontend-agnostic engine — handlers, state, events, IPC types.
simple-directory-engine = { path = "../simple-directory-engine" }
simple-directory-ipc = { path = "../simple-directory-ipc" }
# Agent-session snapshots validate vault-relative paths and read the index.
simple-directory-core = { path = "../simple-directory-core" }
libsql = { workspace = true }
tokio = { workspace = true }

# Panic isolation for the socket accept loop (FutureExt::catch_unwind).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Logging (init in `run` + the TauriEventSink adapter warns on emit failure).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

# Tokenizes a console line the way a shell would (quoting, escapes) before clap parses it.

# Embedded terminal: PTY pair + child spawn, and the byte-safe wire encoding for
# PTY output (raw bytes, since a multi-byte character can split across chunks).
portable-pty = "0.9"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
# Graceful child reaping: SIGTERM, then SIGKILL after a grace period.
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
tempfile = { workspace = true }
# The graph integration test drives a real scan, so the index rows under test
# are the ones the scanner writes rather than hand-seeded SQL.
simple-directory-core = { path = "../simple-directory-core" }
tokio-util = { workspace = true }

[features]
# Empty by default so the gate and `tauri dev` compile the same feature set.
# `custom-protocol` selects the production context (embedded assets over the
# dev server); `tauri build` supplies it, and it stays a manual escape hatch.
default = []
custom-protocol = ["tauri/custom-protocol"]
