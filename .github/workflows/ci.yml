name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: contracts + renderer (typecheck, lint, format, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # node-pty (legacy agent-host tests) must be built for this Node ABI.
      - run: pnpm rebuild:node
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The Rust registry is generated from the TypeScript contracts.
      - run: pnpm contracts:check
      # Every shipped Rust crate and bundled package is listed (cargo is preinstalled on the runner).
      - run: pnpm notices:check
      # Renderer, contracts and the legacy TypeScript suites.
      - run: pnpm test
      - run: pnpm --filter @omenflow/desktop build:rust-ui

  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenSCAD is installed and required on both: engine tests fail if it is missing.
          - os: macos-14
            openscad: snapshot
          # The Linux packages' build base (scripts/linux/Dockerfile): Ubuntu 22.04, its
          # libraries and its OpenSCAD 2021.01, the oldest engine the tests run against.
          - os: ubuntu-22.04
            openscad: distribution
    runs-on: ${{ matrix.os }}
    env:
      # Ubuntu's OpenSCAD renders from the command line without a display.
      QT_QPA_PLATFORM: ${{ matrix.openscad == 'distribution' && 'offscreen' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The same list the Linux package container installs (scripts/linux/Dockerfile).
      - name: Desktop system libraries and OpenSCAD (Tauri webview, engine tests)
        if: runner.os == 'Linux'
        run: |
          sudo sh scripts/linux/build-deps.sh --openscad
          openscad --version
      - name: Install OpenSCAD (development snapshot, as used to verify the Rust engine)
        if: matrix.openscad == 'snapshot'
        run: |
          brew install --cask openscad@snapshot
          openscad --version
      # The desktop crate's build script needs the release helper it bundles, and the
      # real-helper round trip runs it.
      - run: cargo build --release --locked --manifest-path native/omenflow-bridge/Cargo.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p omenflow-agent-host --locked -- --ignored

  bridge:
    name: omenflow helper (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/omenflow-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: cargo test --locked

  conformance:
    name: conformance suite + headless smoke (Rust host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      # Builds omenflow-host and runs every *.conformance.ts case against it.
      # No case renders with OpenSCAD.
      - run: pnpm test:conformance
      - run: pnpm build:bridge
      - run: pnpm smoke:headless

  package-macos:
    name: Rust package + packaged smoke (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm make
      - run: pnpm release:macos:adhoc
      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: omenflow-macos-arm64
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: Rust packages (deb, rpm, AppImage) + packaged smoke (Linux x86_64)
    # Everything runs in containers; the runner matches the Ubuntu 22.04 build base.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The recipe verified on arm64 (docs/release.md): builds the omenflow-linux-build
      # image (Ubuntu 22.04) from scripts/linux/Dockerfile, copies the checkout into a
      # container of it, runs `pnpm make --bundles deb,rpm,appimage` there and checks the
      # glibc and WebKitGTK floors the packages declare against the binaries, then
      # installs the .deb with apt into fresh Ubuntu 22.04, Ubuntu 24.04 and Debian 12
      # containers, runs the AppImage on a fresh Ubuntu 22.04 without WebKit, and installs
      # the .rpm with dnf on a fresh Fedora 42, each followed by the packaged smoke under
      # Xvfb (window, helper, bridge, grant round trip, stand-in agent, WebKitGTK snapshot,
      # SIGTERM quits with status 0 and ends the agent's process group). The test suites
      # run in the jobs above.
      - run: node scripts/linux-package.mjs --skip-tests
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: omenflow-linux-x86_64
          path: |
            target/release/bundle/linux-amd64/*.deb
            target/release/bundle/linux-amd64/*.rpm
            target/release/bundle/linux-amd64/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omenflow-linux-x86_64-smoke
          path: target/release/bundle/linux-amd64/*.png
          if-no-files-found: warn
          retention-days: 7

  legacy-cad:
    name: legacy TypeScript CAD evaluator (OpenSCAD 2021.01)
    runs-on: ubuntu-24.04
    env:
      # Ubuntu Noble's published package; update deliberately with geometry checks.
      # https://packages.ubuntu.com/noble/openscad
      OPENSCAD_PACKAGE_VERSION: 2021.01-6build4
      OMENFLOW_OPENSCAD_E2E: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install and verify the pinned distribution engine
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "openscad=${OPENSCAD_PACKAGE_VERSION}"
          test "$(dpkg-query -W -f='${Version}' openscad)" = "$OPENSCAD_PACKAGE_VERSION"
          openscad --version 2>&1 | tee openscad-version.txt
          grep -F 'OpenSCAD version 2021.01' openscad-version.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild:node
      - name: Require a functioning engine before running suites that permit local skips
        run: >-
          pnpm exec tsx -e 'import { OpenScadAdapter } from "@omenflow/engineering";
          new OpenScadAdapter().probe().then((p) => {
          console.log(JSON.stringify(p));
          if (!p.available || p.executablePath !== "/usr/bin/openscad") process.exit(1);
          });'
      - name: Run real geometry and evaluator tests
        run: >-
          pnpm exec vitest run
          packages/engineering/src/openscad.test.ts
          packages/engineering/src/mesh.test.ts
          packages/engineering/src/cad-tools.test.ts
          packages/engineering/src/cad-consistency.test.ts
          tests/cad-evaluator.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openscad-linux-version
          path: openscad-version.txt
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: experimental Rust package (Windows x64; not a release gate)
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: omenflow-win32-x64
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 7
